[project]
name = "library"
version = "0.1.0"
description = "Self-hosted document archive"
readme = "README.md"
# The support floor. The interpreter dev, CI and the image all actually use is
# pinned in `.python-version` (3.13), matching the `python:3.13-slim-bookworm`
# runtime in the Dockerfile. Without that pin `uv` resolves the newest
# interpreter satisfying this range, which put CI on 3.14 while production ran
# 3.13 — the gating suite was not running on the Python being shipped.
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic-settings>=2.14.2",
    "sqlalchemy[asyncio]>=2.0.50",
    "asyncpg>=0.31.0",
    "alembic>=1.18.4",
    "pillow>=12.3.0",
    "pillow-heif>=1.4.0",
    "filetype>=1.2.0",
    "python-multipart>=0.0.32",
    "procrastinate>=3.8.1",
    "psycopg[binary]>=3.2",
    "ocrmypdf>=17.5.0",
    "pypdfium2>=5.9.0",
    "img2pdf>=0.6.3",
    "opencv-python-headless>=4.13.0.92",
    # >=3.9.2, not >=3.8.2: 3.8.2 was yanked from PyPI ("missing
    # arch_config.yaml causing PyTorch engine failure"). The yank reason is
    # PyTorch-engine-specific and we pin every stage to ONNXRUNTIME
    # (ocr/photo.py get_engine), so this was never a live fault here — but a
    # yanked floor means a fresh resolve has to pick it up explicitly, so
    # raise the floor past it rather than carry a withdrawn release.
    "rapidocr>=3.9.2",
    "onnxruntime>=1.26.0",
    "anthropic>=0.109.1",
    # Subscription LLM backend (see docs/llm-backends.md). Bundles a
    # platform-native Claude Code CLI binary (~190MB) in the wheel, which is
    # what makes OAuth/subscription auth reachable at all — the raw Messages
    # API refuses non-Haiku models for a subscription token.
    "claude-agent-sdk>=0.2.142",
    # OpenTelemetry: metrics only (no traces/logs today). The API + SDK are the
    # instrumentation surface; the two exporters are the two ways metrics leave
    # the process, and both are optional at runtime — see docs/observability.md.
    #   * prometheus — pull. Feeds GET /metrics for the existing Prometheus.
    #   * otlp/http  — push. For an OTel collector. http/protobuf rather than
    #     grpc so the dependency tree stays httpx-shaped and no C extension or
    #     extra port is involved.
    "opentelemetry-api>=1.30",
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-prometheus>=0.51b0",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
    "prometheus-client>=0.21",
    "pgvector>=0.3.6",
    "httpx>=0.28",
    "pwdlib[argon2]>=0.2",
    "typer>=0.15",
    # >=3.4.4, not >=3.4.3: 3.4.3 carries the security fixes (IPv6-transition
    # SSRF bypasses, Host/Origin validation against DNS rebinding, OAuth
    # redirect validation) but its Host/Origin guard changed the default for
    # ASGI/reverse-proxy deployments — which is exactly how the MCP app is
    # mounted here (app.py mounts create_mcp_http_app() into the FastAPI
    # lifespan, behind a proxy). 3.4.4 restores that compatibility.
    "fastmcp>=3.4.4",
    "watchfiles>=1.2.0",
    "imap-tools>=1.13.0",
    "sse-starlette>=2.1",
    "markdownify>=1.2.3",
    "mammoth>=1.12.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.26",
    "coverage>=7.6",
    "httpx>=0.28",
    "ruff>=0.11",
    "testcontainers[postgres]>=4.14.2",
    # Lints .github/workflows/**: expression contexts, action versions, shell.
    # Added after a `secrets` reference in a step-level `if` — not an available
    # context there — made the whole workflow unparseable. That mode is nastier
    # than a red check: NO job runs, so every check is simply absent rather than
    # failing, and nothing in the repo read the file to say why.
    "actionlint-py>=1.7.7",
    # Pinned to a minor range, not left floating. Before this, mypy was in
    # neither pyproject.toml nor uv.lock, so `uv run mypy` silently fell through
    # to whatever ambient install the developer happened to have — which means
    # the error count was a property of the machine, not of the code, and no
    # baseline taken on one checkout could be reproduced on another (or in CI).
    "mypy>=1.19,<1.20",
]

[project.scripts]
library = "library.cli:main"

[build-system]
requires = ["uv_build>=0.9.0,<0.10.0"]
build-backend = "uv_build"

[tool.uv]
# rapidocr declares a hard dependency on opencv-python (the GUI build, which
# needs libGL at runtime); we ship opencv-python-headless instead. The
# impossible marker removes the GUI build from the resolution everywhere;
# both packages provide the same `cv2` module.
override-dependencies = ["opencv-python ; sys_platform == 'never'"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "RUF", # ruff-specific
]

[tool.mypy]
python_version = "3.13"
files = ["src"]
# Deliberately not `strict`. The point of the first pass is a gate that is green
# on day one and rejects new breakage — not a 700-error wall nobody clears, which
# is the shape that gets `continue-on-error`'d and then ignored. Tightening is a
# follow-up, one flag at a time, each with its own cleanup.
warn_redundant_casts = true
warn_unused_ignores = true
# `# type: ignore` with no code is a blanket suppression that also hides the next,
# unrelated error on that line. Require the code so a suppression stays specific.
enable_error_code = ["ignore-without-code"]

# Third-party packages that ship no type information. This is not a suppression
# of our code: without it mypy reports the *import* and then treats the module as
# `Any`, so the errors it produces are noise about someone else's packaging.
[[tool.mypy.overrides]]
module = [
    "asyncpg.*",
    "filetype.*",
    "img2pdf.*",
    "mammoth.*",
    "pgvector.*",
    "pillow_heif.*",
    "pypdfium2.*",
]
ignore_missing_imports = true

# --- Quarantine: empty ------------------------------------------------------
#
# There are no `disable_error_code` overrides. `uv run mypy` is green because
# the tree is clean, not because anything is suppressed.
#
# The mechanism that got it here stays armed. `mypy-baseline.json` is `{}` and
# `scripts/check_mypy.py` runs in CI with any quarantine lifted, so a new
# override cannot be added without a measured count beside it — and once added,
# the count can neither rise nor quietly fall. Keeping an empty baseline rather
# than deleting the file is the point: re-quarantining is allowed, doing it
# unmeasured is not.
#
# What the quarantine cost while it existed, for the next person tempted to
# reach for one: four modules, 98 errors, and comments whose numbers had drifted
# from reality in three different directions because nothing compared them to
# anything. 51 of the 98 came from two instances of the same one-line bug
# (`getattr(block, "type", None)`, which defeats mypy's narrowing of the
# Anthropic SDK's content union), sitting behind an override that described them
# as a refactor nobody had time for.

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: tests that need Docker (ephemeral Postgres via testcontainers)",
    "slow_ocr: real OCR engine runs (tesseract/ocrmypdf binaries, RapidOCR model download)",
    "golden_extraction: characterisation of extraction over the real corpus, replayed from cassettes (no API key, no DB)",
]
filterwarnings = [
    # Starlette's TestClient warns that driving it via httpx is deprecated. The
    # httpx2 runtime migration is deliberately deferred; silence the test-only
    # noise until we take that on. Matched by message only (the backticked text)
    # rather than by StarletteDeprecationWarning: naming the category would force
    # pytest to import starlette.testclient at config time, and that import emits
    # the very warning before the filter is active.
    "ignore:Using .httpx. with .starlette.testclient. is deprecated",
]

[tool.coverage.run]
source = ["src/library"]
# SQLAlchemy's asyncio layer runs ORM and DBAPI work inside a greenlet, and
# coverage loses the tracer across the greenlet switch unless `greenlet` is a
# declared concurrency mode — so async handler bodies read as "missing" even
# though the tests execute them. Without this, api/documents.py measured 55%
# against a true 99%, and the whole-suite total read 89% against a true 95%.
#
# An earlier version of this comment blamed FastAPI's TestClient anyio blocking
# portal. That was wrong: a minimal FastAPI app with a real suspending await
# traces to 100% under TestClient with the default tracer. The greenlet bridge
# is the cause, and it is one config line, not a follow-up project.
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
# Coverage gate: `coverage report` exits non-zero below this, failing CI.
#
# Re-baselined from 85 once the greenlet tracer above was fixed. The suite
# measures 95% honestly; at 85 the gate carried ten points of slack and a whole
# subsystem could have landed untested without turning it red. 93 leaves ~2
# points of headroom — roughly one new 200-statement module at 0% — which is a
# gate that bites without failing on a single uncovered error branch.
#
# The frontend keeps its own, separate thresholds in frontend/vitest.config.ts;
# the two numbers are deliberately different and scripts/coverage_summary.py
# reports them separately.
fail_under = 93
show_missing = true
