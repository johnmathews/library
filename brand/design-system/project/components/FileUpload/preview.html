<!-- @dsCard group="Forms" height=460 subtitle="Drop zone, then each file's progress and result" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FileUpload — preview</title>
<style>
body { margin: 0; background: var(--canvas); color: var(--ink); font-family: var(--font-sans); font-size: 14px; line-height: 21px; -webkit-font-smoothing: antialiased; }
.lb-pad { padding: var(--space-5); display: grid; gap: var(--space-4); align-content: start; }
.lb-row { display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: center; }
.lb-stack { display: grid; gap: var(--space-2); }
.lb-state { font-size: 13px; line-height: 18px; color: var(--ink-secondary); min-width: 84px; }
.lb-num { font-variant-numeric: tabular-nums; }
.lb-mono { font-family: var(--font-mono); font-size: 13px; }
.lb-i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
:focus-visible, .is-focus { outline: 2px solid var(--focus); outline-offset: 2px; }
@media (max-width: 640px) { .lb-pad { padding: var(--space-4); } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* Buttons */
.lb-btn { font: 600 13.5px/1 var(--font-sans); display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: var(--radius-sm); border: 1px solid var(--control-border); background: var(--panel); color: var(--ink); white-space: nowrap; cursor: pointer; text-decoration: none; box-sizing: border-box; }
.lb-btn:hover, .lb-btn.is-hover { background: var(--tile); }
.lb-btn.primary { background: var(--brand-fill); border-color: var(--brand-fill); color: var(--on-brand); }
.lb-btn.primary:hover, .lb-btn.primary.is-hover { filter: brightness(1.1); }
.lb-btn.ghost { border-color: transparent; background: transparent; color: var(--brand); }
.lb-btn.icon { width: 34px; padding: 0; justify-content: center; }
.lb-btn.round { border-radius: var(--radius-full); }
.lb-btn[aria-disabled="true"] { opacity: .4; cursor: not-allowed; }

/* Tag chips */
.lb-tag { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 9px; border-radius: var(--radius-full); background: var(--tile); color: var(--ink); font-size: 12.5px; line-height: 16px; font-weight: 600; white-space: nowrap; box-sizing: border-box; }
.lb-tag .lb-i { width: 14px; height: 14px; }
.lb-tag.attn { background: var(--attention-tint); color: var(--attention); }
.lb-tag.fail { background: var(--deficit-tint); color: var(--error-ink); }
.lb-tag button { all: unset; display: inline-grid; place-items: center; margin-right: -4px; border-radius: var(--radius-full); cursor: pointer; }

/* Links */
.lb-link { color: var(--brand); font-weight: 600; text-decoration: none; }
.lb-link:hover, .lb-link.is-hover { text-decoration: underline; text-underline-offset: 3px; }
.lb-link.inline { font-weight: 500; text-decoration: underline; text-underline-offset: 3px; }
.lb-link.quiet { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
.lb-back { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; }

.lb-drop { border: 1.5px dashed var(--control-border); border-radius: var(--radius-md); background: var(--panel); padding: 22px 16px; display: grid; justify-items: center; gap: 6px; text-align: center; }
.lb-drop > .lb-i { width: 24px; height: 24px; color: var(--ink-secondary); }
.lb-drop p { margin: 0; }
.lb-drop .hint { font-size: 13px; line-height: 18px; color: var(--ink-secondary); }
.lb-drop.is-over { border-color: var(--brand); background: var(--brand-tint); }
.lb-files { list-style: none; margin: 0; padding: 0; background: var(--panel); border-radius: var(--radius-md); box-shadow: var(--shadow-card); }
.lb-files li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; padding: 10px 14px; border-top: 1px solid var(--line); }
.lb-files li:first-child { border-top: 0; }
.lb-files .name { font-family: var(--font-mono); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lb-files .more { grid-column: 1 / -1; font-size: 13px; line-height: 18px; color: var(--ink-secondary); }
.lb-track { grid-column: 1 / -1; height: 6px; border-radius: var(--radius-full); background: var(--tile); overflow: hidden; }
.lb-track i { display: block; height: 100%; width: 60%; background: var(--brand-solid); border-radius: var(--radius-full); }
.lb-end { display: flex; justify-content: flex-end; }
</style>
</head>
<body>
<div class="lb-pad">
  <div class="lb-drop"><svg class="lb-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V5"/><path d="M8 9l4-4 4 4"/><path d="M5 15v3a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-3"/></svg><p>Drop files here, or <a class="lb-link" href="#">choose files</a></p><p class="hint">PDFs, photos and text notes, up to 100 MB each.</p></div>
  <ul class="lb-files">
    <li><span class="name">jaarafrekening-2026.pdf</span><span class="lb-tag"><svg class="lb-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Indexed</span></li>
    <li><span class="name">kassabon-tandarts.jpg</span><span class="lb-tag">Processing</span><span class="lb-track" role="progressbar" aria-label="Processing kassabon-tandarts.jpg" aria-valuenow="60" aria-valuemin="0" aria-valuemax="100"><i></i></span></li>
    <li><span class="name">polis-2027.pdf</span><span class="lb-tag">Already in the library</span><span class="more"><a class="lb-link" href="#">Open Health insurance policy 2027</a></span></li>
    <li><span class="name">scan-0031.pdf</span><span class="lb-tag fail"><svg class="lb-i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5v5.5M12 16.5v.01"/></svg>Failed</span><span class="more">The file is password protected. <a class="lb-link" href="#">See the job</a></span></li>
  </ul>
  <div class="lb-end"><button class="lb-btn primary"><svg class="lb-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V5"/><path d="M8 9l4-4 4 4"/><path d="M5 15v3a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-3"/></svg> Upload</button></div>
</div>
</body>
</html>
