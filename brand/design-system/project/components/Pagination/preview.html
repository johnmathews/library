<!-- @dsCard group="Tables" height=230 subtitle="The count, then previous, pages and next" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pagination — preview</title>
<style>
body { margin: 0; background: var(--canvas); color: var(--ink); font-family: var(--font-sans); font-size: 14px; line-height: 21px; -webkit-font-smoothing: antialiased; }
.lb-pad { padding: var(--space-5); display: grid; gap: var(--space-4); align-content: start; }
.lb-row { display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: center; }
.lb-stack { display: grid; gap: var(--space-2); }
.lb-state { font-size: 13px; line-height: 18px; color: var(--ink-secondary); min-width: 84px; }
.lb-num { font-variant-numeric: tabular-nums; }
.lb-mono { font-family: var(--font-mono); font-size: 13px; }
.lb-i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
:focus-visible, .is-focus { outline: 2px solid var(--focus); outline-offset: 2px; }
@media (max-width: 640px) { .lb-pad { padding: var(--space-4); } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* Buttons */
.lb-btn { font: 600 13.5px/1 var(--font-sans); display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: var(--radius-sm); border: 1px solid var(--control-border); background: var(--panel); color: var(--ink); white-space: nowrap; cursor: pointer; text-decoration: none; box-sizing: border-box; }
.lb-btn:hover, .lb-btn.is-hover { background: var(--tile); }
.lb-btn.primary { background: var(--brand-fill); border-color: var(--brand-fill); color: var(--on-brand); }
.lb-btn.primary:hover, .lb-btn.primary.is-hover { filter: brightness(1.1); }
.lb-btn.ghost { border-color: transparent; background: transparent; color: var(--brand); }
.lb-btn.icon { width: 34px; padding: 0; justify-content: center; }
.lb-btn.round { border-radius: var(--radius-full); }
.lb-btn[aria-disabled="true"] { opacity: .4; cursor: not-allowed; }

.lb-pager { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
.lb-count { font-size: 13px; color: var(--ink-secondary); font-variant-numeric: tabular-nums; }
.lb-pages { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
.lb-pages .lb-btn { min-width: 34px; justify-content: center; font-variant-numeric: tabular-nums; }
.lb-pages .lb-btn.page { border-color: transparent; background: transparent; }
.lb-pages .lb-btn.page:hover { background: var(--tile); }
.lb-pages .lb-btn[aria-current] { background: var(--brand-tint); color: var(--brand-on-tint); border-color: transparent; font-weight: 650; }
.lb-gap { padding: 0 4px; color: var(--ink-secondary); }
</style>
</head>
<body>
<div class="lb-pad">
  <nav class="lb-pager" aria-label="Pagination"><span class="lb-count">Showing 25–48 of 312</span>
    <span class="lb-pages"><button class="lb-btn"><svg class="lb-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg> Previous</button><button class="lb-btn page" aria-label="Page 1">1</button><button class="lb-btn page" aria-label="Page 2" aria-current="page">2</button><button class="lb-btn page" aria-label="Page 3">3</button><span class="lb-gap">…</span><button class="lb-btn page" aria-label="Page 13">13</button><button class="lb-btn">Next <svg class="lb-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button></span>
  </nav>
  <nav class="lb-pager" aria-label="Pagination"><span class="lb-count">Showing 1–24 of 312</span>
    <span class="lb-pages"><button class="lb-btn" aria-disabled="true"><svg class="lb-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg> Previous</button><button class="lb-btn page" aria-label="Page 1" aria-current="page">1</button><button class="lb-btn page" aria-label="Page 2">2</button><span class="lb-gap">…</span><button class="lb-btn page" aria-label="Page 13">13</button><button class="lb-btn">Next <svg class="lb-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button></span>
  </nav>
</div>
</body>
</html>
