<!-- @dsCard group="Messages" height=280 subtitle="A short note that something finished or failed" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toast — preview</title>
<style>
body { margin: 0; background: var(--canvas); color: var(--ink); font-family: var(--font-sans); font-size: 14px; line-height: 21px; -webkit-font-smoothing: antialiased; }
.lb-pad { padding: var(--space-5); display: grid; gap: var(--space-4); align-content: start; }
.lb-row { display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: center; }
.lb-stack { display: grid; gap: var(--space-2); }
.lb-state { font-size: 13px; line-height: 18px; color: var(--ink-secondary); min-width: 84px; }
.lb-num { font-variant-numeric: tabular-nums; }
.lb-mono { font-family: var(--font-mono); font-size: 13px; }
.lb-i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
:focus-visible, .is-focus { outline: 2px solid var(--focus); outline-offset: 2px; }
@media (max-width: 640px) { .lb-pad { padding: var(--space-4); } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* Buttons */
.lb-btn { font: 600 13.5px/1 var(--font-sans); display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: var(--radius-sm); border: 1px solid var(--control-border); background: var(--panel); color: var(--ink); white-space: nowrap; cursor: pointer; text-decoration: none; box-sizing: border-box; }
.lb-btn:hover, .lb-btn.is-hover { background: var(--tile); }
.lb-btn.primary { background: var(--brand-fill); border-color: var(--brand-fill); color: var(--on-brand); }
.lb-btn.primary:hover, .lb-btn.primary.is-hover { filter: brightness(1.1); }
.lb-btn.ghost { border-color: transparent; background: transparent; color: var(--brand); }
.lb-btn.icon { width: 34px; padding: 0; justify-content: center; }
.lb-btn.round { border-radius: var(--radius-full); }
.lb-btn[aria-disabled="true"] { opacity: .4; cursor: not-allowed; }

/* Links */
.lb-link { color: var(--brand); font-weight: 600; text-decoration: none; }
.lb-link:hover, .lb-link.is-hover { text-decoration: underline; text-underline-offset: 3px; }
.lb-link.inline { font-weight: 500; text-decoration: underline; text-underline-offset: 3px; }
.lb-link.quiet { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
.lb-back { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; }

.lb-stack { display: grid; gap: 8px; justify-items: end; }
.lb-toast { width: 320px; max-width: 100%; box-sizing: border-box; background: var(--panel); border-radius: var(--radius-md); box-shadow: var(--shadow-pop); padding: 12px 8px 12px 14px; display: flex; gap: 10px; align-items: flex-start; }
.lb-toast > .lb-i { margin-top: 2px; }
.lb-toast .txt { flex: 1; min-width: 0; display: grid; gap: 2px; }
.lb-toast b { font-weight: 600; }
.lb-toast span { color: var(--ink-secondary); font-size: 13px; line-height: 18px; }
.lb-toast.error > .lb-i, .lb-toast.error b { color: var(--error-ink); }
.lb-toast .lb-btn { width: 28px; height: 28px; margin-top: -4px; border-color: transparent; background: transparent; color: var(--ink-secondary); }
</style>
</head>
<body>
<div class="lb-pad"><div class="lb-stack">
  <div class="lb-toast" role="status"><svg class="lb-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><div class="txt"><b>Document processed</b><span>Annual energy statement 2026</span></div><button class="lb-btn icon" aria-label="Dismiss"><svg class="lb-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"/></svg></button></div>
  <div class="lb-toast error" role="alert"><svg class="lb-i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5v5.5M12 16.5v.01"/></svg><div class="txt"><b>Processing failed</b><span>scan-0031.pdf is password protected. <a class="lb-link" href="#">See the job</a></span></div><button class="lb-btn icon" aria-label="Dismiss"><svg class="lb-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"/></svg></button></div>
  <div class="lb-toast" role="status"><svg class="lb-i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.5M12 7.5v.01"/></svg><div class="txt"><b>Upload started</b><span>3 documents queued for processing.</span></div><button class="lb-btn icon" aria-label="Dismiss"><svg class="lb-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"/></svg></button></div>
</div></div>
</body>
</html>
