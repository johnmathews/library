<!-- @dsCard group="Forms" height=380 subtitle="One filter's panel, under its chip" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FilterPopover — preview</title>
<style>
body { margin: 0; background: var(--canvas); color: var(--ink); font-family: var(--font-sans); font-size: 14px; line-height: 21px; -webkit-font-smoothing: antialiased; }
.lb-pad { padding: var(--space-5); display: grid; gap: var(--space-4); align-content: start; }
.lb-row { display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: center; }
.lb-stack { display: grid; gap: var(--space-2); }
.lb-state { font-size: 13px; line-height: 18px; color: var(--ink-secondary); min-width: 84px; }
.lb-num { font-variant-numeric: tabular-nums; }
.lb-mono { font-family: var(--font-mono); font-size: 13px; }
.lb-i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
:focus-visible, .is-focus { outline: 2px solid var(--focus); outline-offset: 2px; }
@media (max-width: 640px) { .lb-pad { padding: var(--space-4); } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* Filter chips */
.lb-chip { position: relative; display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: var(--radius-full); border: 1px solid var(--control-border); background: var(--panel); font-size: 13px; font-weight: 600; color: var(--ink); white-space: nowrap; box-sizing: border-box; }
.lb-chip.on { background: var(--brand-tint); border-color: var(--brand); color: var(--brand-on-tint); }
.lb-chip.add { border-style: dashed; color: var(--ink-secondary); }
.lb-chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

/* Buttons */
.lb-btn { font: 600 13.5px/1 var(--font-sans); display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: var(--radius-sm); border: 1px solid var(--control-border); background: var(--panel); color: var(--ink); white-space: nowrap; cursor: pointer; text-decoration: none; box-sizing: border-box; }
.lb-btn:hover, .lb-btn.is-hover { background: var(--tile); }
.lb-btn.primary { background: var(--brand-fill); border-color: var(--brand-fill); color: var(--on-brand); }
.lb-btn.primary:hover, .lb-btn.primary.is-hover { filter: brightness(1.1); }
.lb-btn.ghost { border-color: transparent; background: transparent; color: var(--brand); }
.lb-btn.icon { width: 34px; padding: 0; justify-content: center; }
.lb-btn.round { border-radius: var(--radius-full); }
.lb-btn[aria-disabled="true"] { opacity: .4; cursor: not-allowed; }

/* Fields */
.lb-field { display: grid; gap: 6px; min-width: 0; }
.lb-label { font-size: 13px; line-height: 18px; font-weight: 600; color: var(--ink); }
.lb-hint { font-size: 13px; line-height: 18px; color: var(--ink-secondary); margin: 0; }
.lb-input { font: 400 14px/20px var(--font-sans); height: 36px; padding: 0 12px; box-sizing: border-box; width: 100%; background: var(--panel); color: var(--ink); border: 1px solid var(--control-border); border-radius: var(--radius-sm); }
.lb-input::placeholder { color: var(--ink-secondary); opacity: 1; }
.lb-input.invalid { border-color: var(--error-ink); }
.lb-error { display: flex; gap: 6px; align-items: flex-start; font-size: 13px; line-height: 18px; color: var(--error-ink); margin: 0; }
.lb-search { position: relative; display: flex; align-items: center; }
.lb-search .lb-i { position: absolute; left: 12px; color: var(--ink-secondary); }
.lb-search .lb-input { height: 38px; padding-left: 36px; }
@media (pointer: coarse) { .lb-input { font-size: 16px; } }

.lb-anchor { display: grid; gap: 6px; justify-items: start; }
.lb-pop { width: 290px; max-width: 100%; box-sizing: border-box; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-lg); box-shadow: var(--shadow-pop); padding: 12px; display: grid; gap: 10px; }
.lb-list { list-style: none; margin: 0; padding: 0; display: grid; }
.lb-list li { display: flex; align-items: center; gap: 10px; padding: 6px 4px; border-radius: var(--radius-sm); }
.lb-list li:hover, .lb-list li.is-hover { background: var(--tile); }
.lb-list .n { margin-left: auto; font-size: 12.5px; color: var(--ink-secondary); font-variant-numeric: tabular-nums; }
.lb-box { width: 16px; height: 16px; box-sizing: border-box; flex: none; border: 1.5px solid var(--control-border); background: var(--panel); border-radius: 4px; display: grid; place-items: center; color: var(--on-brand); }
.lb-box.on { background: var(--brand-fill); border-color: var(--brand-fill); }
.lb-box .lb-i { width: 12px; height: 12px; stroke-width: 3; }
.lb-foot { display: flex; justify-content: flex-end; gap: 8px; border-top: 1px solid var(--line); padding-top: 10px; }
</style>
</head>
<body>
<div class="lb-pad"><div class="lb-anchor">
  <span class="lb-chip on">Sender: Energiebedrijf Noord <svg class="lb-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></span>
  <div class="lb-pop" role="dialog" aria-label="Sender">
    <label class="lb-search" aria-label="Search senders"><svg class="lb-i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg><input class="lb-input" placeholder="Search senders"></label>
    <ul class="lb-list">
      <li><span class="lb-box on"><svg class="lb-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>Energiebedrijf Noord<span class="n">12</span></li>
      <li class="is-hover"><span class="lb-box"></span>Zorgverzekeraar Delta<span class="n">8</span></li>
      <li><span class="lb-box"></span>Waterbedrijf West<span class="n">6</span></li>
      <li><span class="lb-box"></span>Tandartspraktijk De Kroon<span class="n">3</span></li>
      <li><span class="lb-box"></span>Fietsenmaker Oost<span class="n">2</span></li>
    </ul>
    <div class="lb-foot"><button class="lb-btn ghost">Clear</button><button class="lb-btn primary">Show 12</button></div>
  </div>
</div></div>
</body>
</html>
