<!-- @dsCard group="Layout" height=570 subtitle="Sidebar with the logo, header and phone bar" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AppShell — preview</title>
<style>
body { margin: 0; background: var(--canvas); color: var(--ink); font-family: var(--font-sans); font-size: 14px; line-height: 21px; -webkit-font-smoothing: antialiased; }
.lb-pad { padding: var(--space-5); display: grid; gap: var(--space-4); align-content: start; }
.lb-row { display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: center; }
.lb-stack { display: grid; gap: var(--space-2); }
.lb-state { font-size: 13px; line-height: 18px; color: var(--ink-secondary); min-width: 84px; }
.lb-num { font-variant-numeric: tabular-nums; }
.lb-mono { font-family: var(--font-mono); font-size: 13px; }
.lb-i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
:focus-visible, .is-focus { outline: 2px solid var(--focus); outline-offset: 2px; }
@media (max-width: 640px) { .lb-pad { padding: var(--space-4); } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* Buttons */
.lb-btn { font: 600 13.5px/1 var(--font-sans); display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: var(--radius-sm); border: 1px solid var(--control-border); background: var(--panel); color: var(--ink); white-space: nowrap; cursor: pointer; text-decoration: none; box-sizing: border-box; }
.lb-btn:hover, .lb-btn.is-hover { background: var(--tile); }
.lb-btn.primary { background: var(--brand-fill); border-color: var(--brand-fill); color: var(--on-brand); }
.lb-btn.primary:hover, .lb-btn.primary.is-hover { filter: brightness(1.1); }
.lb-btn.ghost { border-color: transparent; background: transparent; color: var(--brand); }
.lb-btn.icon { width: 34px; padding: 0; justify-content: center; }
.lb-btn.round { border-radius: var(--radius-full); }
.lb-btn[aria-disabled="true"] { opacity: .4; cursor: not-allowed; }

/* Card */
.lb-card { background: var(--panel); border-radius: var(--radius-md); box-shadow: var(--shadow-card); padding: var(--space-5) 22px; display: grid; gap: 14px; align-content: start; min-width: 0; }
.lb-card-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: var(--space-2); }
.lb-card h2, .lb-h2 { margin: 0; font-size: 16px; line-height: 22px; font-weight: 650; }
.lb-sub { margin: -10px 0 0; color: var(--ink-secondary); font-size: 13px; line-height: 18px; }
.lb-lead { margin: 0; color: var(--ink-secondary); font-size: 15px; line-height: 22px; }
@media (max-width: 640px) { .lb-card { padding: var(--space-4); } }

/* App icon: the brand-fill square with the mark in on-brand. */
.lb-icon { display: block; flex: none; }
.lb-icon .sq { fill: var(--brand-fill); }
.lb-icon .mark { color: var(--on-brand); }
.lb-icon .knock { fill: var(--brand-fill); stroke: var(--brand-fill); }
.lb-icon .ring { fill: var(--brand-fill); stroke: currentColor; }

/* Shell */
.lb-shell { display: grid; grid-template-columns: 216px 1fr; min-height: 520px; }
.lb-side { background: var(--panel); border-right: 1px solid var(--line); padding: 20px 12px; display: grid; align-content: start; gap: 2px; }
.lb-logo { display: flex; align-items: center; gap: 10px; padding: 0 8px 18px; color: var(--ink); text-decoration: none; }
.lb-logo .name { font-size: 18px; line-height: 24px; font-weight: 650; letter-spacing: -0.015em; }
.lb-nav { display: flex; align-items: center; gap: 12px; padding: 6px 10px; border-radius: var(--radius-sm); color: var(--ink); font-weight: 500; text-decoration: none; }
.lb-nav .lb-i { color: var(--ink-secondary); }
.lb-nav[aria-current] { background: var(--brand-tint); color: var(--brand-on-tint); font-weight: 650; }
.lb-nav[aria-current] .lb-i { color: var(--brand-on-tint); }
.lb-navgap { height: 12px; }
.lb-main { display: grid; align-content: start; min-width: 0; }
.lb-top { display: flex; align-items: center; gap: 10px; height: 64px; padding: 0 32px; border-bottom: 1px solid var(--line); }
.lb-top h1 { margin: 0 auto 0 0; font-size: 24px; line-height: 30px; font-weight: 650; letter-spacing: -0.015em; }
.lb-content { padding: 24px 32px; display: grid; gap: 16px; }
.lb-phonebar { display: none; align-items: center; gap: 10px; height: 56px; padding: 0 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
.lb-phonebar .t { font-weight: 650; font-size: 18px; margin-right: auto; }
@media (max-width: 640px) {
  .lb-shell { grid-template-columns: 1fr; min-height: 0; }
  .lb-side, .lb-top { display: none; }
  .lb-phonebar { display: flex; }
  .lb-content { padding: 14px 16px 20px; }
}
</style>
</head>
<body>

  <div class="lb-main">

</html>
