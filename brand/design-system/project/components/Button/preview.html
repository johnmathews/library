<!-- @dsCard group="Actions" height=260 subtitle="Primary, outline, ghost and icon, every state" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Button — preview</title>
<style>
body { margin: 0; background: var(--canvas); color: var(--ink); font-family: var(--font-sans); font-size: 14px; line-height: 21px; -webkit-font-smoothing: antialiased; }
.lb-pad { padding: var(--space-5); display: grid; gap: var(--space-4); align-content: start; }
.lb-row { display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: center; }
.lb-stack { display: grid; gap: var(--space-2); }
.lb-state { font-size: 13px; line-height: 18px; color: var(--ink-secondary); min-width: 84px; }
.lb-num { font-variant-numeric: tabular-nums; }
.lb-mono { font-family: var(--font-mono); font-size: 13px; }
.lb-i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
:focus-visible, .is-focus { outline: 2px solid var(--focus); outline-offset: 2px; }
@media (max-width: 640px) { .lb-pad { padding: var(--space-4); } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* Buttons */
.lb-btn { font: 600 13.5px/1 var(--font-sans); display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: var(--radius-sm); border: 1px solid var(--control-border); background: var(--panel); color: var(--ink); white-space: nowrap; cursor: pointer; text-decoration: none; box-sizing: border-box; }
.lb-btn:hover, .lb-btn.is-hover { background: var(--tile); }
.lb-btn.primary { background: var(--brand-fill); border-color: var(--brand-fill); color: var(--on-brand); }
.lb-btn.primary:hover, .lb-btn.primary.is-hover { filter: brightness(1.1); }
.lb-btn.ghost { border-color: transparent; background: transparent; color: var(--brand); }
.lb-btn.icon { width: 34px; padding: 0; justify-content: center; }
.lb-btn.round { border-radius: var(--radius-full); }
.lb-btn[aria-disabled="true"] { opacity: .4; cursor: not-allowed; }
</style>
</head>
<body>
<div class="lb-pad">
  <div class="lb-row"><span class="lb-state">Primary</span><button class="lb-btn primary"><svg class="lb-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V5"/><path d="M8 9l4-4 4 4"/><path d="M5 15v3a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-3"/></svg> Upload</button><button class="lb-btn primary is-hover">Hover</button><button class="lb-btn primary is-focus">Focus</button><button class="lb-btn primary" aria-busy="true">Uploading… 2 of 5</button></div>
  <div class="lb-row"><span class="lb-state">Outline</span><button class="lb-btn"><svg class="lb-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h8M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg> Edit details</button><button class="lb-btn"><svg class="lb-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v10M8 10l4 4 4-4M5 19h14"/></svg> Download</button><button class="lb-btn is-hover">Hover</button><button class="lb-btn" aria-disabled="true">Restore</button></div>
  <div class="lb-row"><span class="lb-state">Ghost, icon</span><button class="lb-btn ghost">Clear</button><button class="lb-btn icon" aria-label="Previous document"><svg class="lb-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button><button class="lb-btn icon" aria-label="Next document"><svg class="lb-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button><button class="lb-btn icon" aria-label="Copy answer"><svg class="lb-i" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg></button><button class="lb-btn icon round" aria-label="Dark mode"><svg class="lb-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 14.5A7.5 7.5 0 0 1 9.5 5a7.5 7.5 0 1 0 9.5 9.5z"/></svg></button></div>
</div>
</body>
</html>
