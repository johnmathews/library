name: CI

on:
  push:
    # main only. This used to be `["**"]`, which ran CI on every feature-branch
    # push as well — and since `pull_request` also fires for those branches,
    # every push to a PR'd branch produced TWO runs, each emitting a check-run
    # named `ci-gate` against the same SHA. That is not merely wasteful: the
    # push run deliberately skips `e2e` (see its `if:` below) and the PR run
    # does not, so the two disagree about what was actually verified, and the
    # required check reflects whichever finished last.
    #
    # The PR run is the gate — it is what the `main` ruleset requires and the
    # only one that runs e2e — so the push run's only unique job was giving
    # feedback before a PR exists. Open the PR (or use workflow_dispatch).
    branches: [main]
  pull_request:
  workflow_dispatch:

# One in-flight run per ref; new pushes cancel the previous run so the
# now-every-branch trigger doesn't stack up CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # Compute which areas the change touches so the unit-test jobs can be skipped
  # when clearly irrelevant (frontend-only change → skip backend; backend/docs
  # change → skip frontend). SAFETY: on main we force both test jobs to run
  # regardless (see their `if:`), because the `build` job bakes real backend +
  # frontend coverage numbers into the promoted image — main must never skip a
  # side and bake a null. A change under .github/workflows (the `ci` output)
  # runs everything. `promote` and the deploy path are unaffected: on main all
  # jobs run. The required check is the `ci-gate` aggregator below, which treats
  # a skipped job as a pass — so path-skipping never blocks a merge.
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'src/**'
              - 'tests/**'
              - 'migrations/**'
              - 'alembic.ini'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'Dockerfile'
              - '.dockerignore'
              - 'docker-compose.yml'
              # .env.example is guarded by test_env_example_documents_every_setting;
              # without it here, a PR that edits only that file skips the very
              # test that checks it.
              - '.env.example'
              - 'Makefile'
              - 'scripts/**'
              # docs/ only, NOT journal/ or a blanket '**/*.md'. The backend
              # suite really does read four real documents — check_docs.py's
              # WORK_UNIT_PLAN, MODULE_MAP_DOC and DOCS_INDEX, all under docs/ —
              # so a docs change can legitimately red it. Nothing under tests/
              # reads journal/ or any .md outside docs/, and the gates that DO
              # cover them (`check_docs.py`, `build_journal_index.py --check`)
              # live in `docs-stamps`, which is unconditional. Journal entries
              # are this repo's most frequent commit; running the whole backend
              # suite for one bought nothing.
              - 'docs/**'
            frontend:
              - 'frontend/**'
            ci:
              # The whole .github tree, not just workflows/: dependabot.yml and
              # any action/config under .github/ affect CI behaviour too.
              - '.github/**'

  backend:
    needs: changes
    # Always on main (coverage baked into the promoted image); on branches/PRs
    # only when backend-relevant paths or the workflow itself changed.
    if: >-
      github.ref == 'refs/heads/main' ||
      needs.changes.outputs.backend == 'true' ||
      needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # update the sticky coverage comment on PRs
    env:
      # Hoisted to the job so the corpus step's `if` can test it. The `secrets`
      # context is NOT available in a step-level `if` (GitHub's context
      # availability table lists github/needs/vars/strategy/matrix/job/runner/
      # env/steps/inputs there, and not secrets), and referencing it anyway is a
      # workflow *parse* error — the whole file is rejected and no job runs, which
      # is how it presents: every check missing rather than one check red.
      GOLDEN_CORPUS_TOKEN: ${{ secrets.GOLDEN_CORPUS_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      # Full version: astral-sh/setup-uv publishes no floating `v8` major tag.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - name: Install OCR system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr tesseract-ocr-nld tesseract-ocr-eng ghostscript unpaper
      - name: Install dependencies
        run: uv sync --locked
      # The golden corpus is 15 real financial/personal documents, so it lives in
      # a private repo rather than this public one. Fetched into samples/, which
      # is gitignored and is where a developer already keeps it, so no test needs
      # to know the difference. Honest cost: fork PRs get no secret and so cannot
      # run these tests — which is why LIBRARY_GOLDEN_CORPUS below turns a
      # missing corpus into a FAILURE here rather than a skip. A characterisation
      # suite that silently skips reports green while measuring nothing.
      #
      # continue-on-error so a corpus-repo outage degrades to a clear test
      # failure naming the missing corpus, not an opaque checkout error.
      - name: Fetch the golden corpus
        id: corpus
        # Tests the job-level env above, not `secrets` (unavailable here) and not
        # a step-level env (a step's own env is not in scope for its own `if`).
        if: env.GOLDEN_CORPUS_TOKEN != ''
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          repository: johnmathews/library-golden-corpus
          token: ${{ secrets.GOLDEN_CORPUS_TOKEN }}
          path: samples
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
          # Workflow linting. Note the limitation, so nobody trusts this further
          # than it goes: if THIS file fails to parse, no job here runs and this
          # step never executes. It covers the other workflow files, shell in
          # `run:` blocks, and deprecated action versions. `make lint-actions`
          # locally is what guards ci.yml itself.
          uv run actionlint -shellcheck= -pyflakes= .github/workflows/*.yml
      - name: Test with coverage
        env:
          # Set only when the corpus was actually fetched. Where it IS set, a
          # missing corpus is a hard error rather than a skip — see the fetch
          # step above.
          LIBRARY_GOLDEN_CORPUS: ${{ steps.corpus.outcome == 'success' && '1' || '' }}
        run: |
          # --junitxml feeds the real-engine non-skip floor in the next step.
          uv run coverage run -m pytest --junitxml=pytest-report.xml
          # Generate the HTML report BEFORE the fail-under gate below, so the
          # artifact is still produced (and uploaded) when coverage drops below
          # threshold — that's exactly when you want to see what's uncovered.
          uv run coverage html
          # Machine-readable totals (totals.percent_covered) for the unified
          # coverage summary the `build` job bakes into the image via
          # scripts/coverage_summary.py. Emitted before the fail-under gate so it
          # exists even when coverage dips below threshold.
          uv run coverage json -o coverage.json
          # Surface the report on the run's summary page and in a file the
          # PR-comment step can reuse.
          {
            echo '## Backend coverage'
            echo
            uv run coverage report --format=markdown
          } | tee coverage.md >> "$GITHUB_STEP_SUMMARY"
          # Enforce the fail-under gate last, after artifacts are produced.
          uv run coverage report
      # The slow_ocr tests are the only coverage over the real OCR binaries and
      # models, and both their guards skip when the engine is unavailable — right
      # for a laptop, a hole here, where this job installs the tesseract stack and
      # has network for the RapidOCR model hub. pytest reports a skip as success,
      # so without this a permanently broken engine is a green build. Runs after
      # the coverage gate rather than before it purely for step ordering; either
      # failure reds the job.
      - name: Assert the real OCR engines actually ran
        run: uv run python scripts/check_engine_skips.py pytest-report.xml
      # Self-arming: hashFiles is empty until the baselines exist in the fetched
      # corpus, so the step is inert without them and enforces the moment they
      # land. The Tier-1 golden tests SKIP for want of cassettes, and a skip is
      # reported as success — exactly the hole the step above closes for the OCR
      # engines.
      #
      # The path is under samples/ because the baselines live in the PRIVATE
      # corpus repo: the snapshots carry every document's full OCR text and the
      # cassettes carry the model's titles and summaries, so neither belongs in
      # this public repo. hashFiles is evaluated when the step is reached, which
      # is after the fetch, so it sees the checked-out files.
      - name: Assert the golden corpus tier actually ran
        if: >-
          steps.corpus.outcome == 'success' &&
          hashFiles('samples/golden_cassettes.json') != ''
        run: |
          uv run python scripts/check_engine_skips.py pytest-report.xml \
            --engine corpus --engine cassettes
      - name: Upload coverage HTML
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage-html
          path: htmlcov/
          # When an earlier step (e.g. lint) fails, coverage never runs and
          # there's no htmlcov/ — don't warn about the expected absence.
          if-no-files-found: ignore
      - name: Upload backend coverage JSON
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage-json
          path: coverage.json
          if-no-files-found: ignore
      - name: Coverage PR comment
        if: success() && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: backend-coverage
          path: coverage.md

  # Documentation freshness. Its own job because it needs `fetch-depth: 0` — the
  # whole gate is comparative (`git log` per file), and under checkout's default
  # depth-1 every file reports HEAD's date, so every doc looks freshly touched and
  # the gate passes everything forever. Verified against a real shallow clone: the
  # three docs sampled all reported the same date.
  #
  # No path filter and no `needs: changes`, deliberately: the check is over repo
  # STATE, not the diff. A doc goes stale because the code it describes moved,
  # which is a commit that touches no docs at all.
  #
  # A RATCHET, not continue-on-error. It started at a baseline of 15 (7 unstamped
  # docs, 8 stamped-but-unverified) because `continue-on-error` would have made
  # this a permanently red check, and a check that is always red trains everyone
  # to ignore it. W27 did the verify-and-stamp sweep, so the baseline is now 0 and
  # the job is in ci-gate's needs: a doc edited without a re-stamp blocks the
  # merge, and the failure is actionable ("re-verify and re-stamp the doc you
  # touched").
  #
  # --max-violations also fails when the count comes in BELOW the baseline, which
  # is what forced this to be lowered rather than left with slack for the next
  # regression to hide in. At 0 that direction is inert, which is the point.
  docs-stamps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - name: Check documentation stamps
        # The ratchet, at its floor: every gated doc is stamped and verified, so
        # the only acceptable count is 0. Kept explicit rather than relying on the
        # default so the baseline stays greppable — raising this number back above
        # 0 is re-opening the ratchet and should look like it.
        run: uv run python scripts/check_docs.py --max-violations 0
      - name: Check the journal index is current
        # Same contract as `ruff format --check`: the generated index must equal
        # what the generator would write, so a new entry without a regenerated
        # index reds here rather than silently leaving the index incomplete.
        # Journal *cadence* is deliberately not gated — that would be a calendar
        # gate in disguise and would red on legitimately quiet weeks.
        run: uv run python scripts/build_journal_index.py --check

  # Static type checking. Its own job rather than a step in `backend` because it
  # needs neither Postgres nor the OCR system packages, so it returns a verdict in
  # under a minute instead of waiting behind a twelve-minute suite — and a type
  # error is exactly the kind of thing you want to hear about immediately.
  #
  # Green from its first run, by design. The four modules carrying most of the
  # errors are quarantined by error *code* in `[tool.mypy]` (never by excluding a
  # file — an excluded file gets zero checking forever), each with a `# RATCHET:`
  # comment naming the follow-up that removes it. Verified: adding `x: int = "s"`
  # to a quarantined module still fails, because `assignment` is not in its
  # disable list. So the quarantine bounds the *known* debt without granting the
  # module a permanent exemption from everything else.
  #
  # mypy is pinned to `>=1.19,<1.20` in the dev group. Before that it was in
  # neither pyproject.toml nor uv.lock, so `uv run mypy` fell through to whatever
  # ambient install the developer had — an error count that was a property of the
  # machine, not the code.
  typecheck:
    needs: changes
    if: >-
      github.ref == 'refs/heads/main' ||
      needs.changes.outputs.backend == 'true' ||
      needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Type check
        # Paths come from `files = ["src"]` in [tool.mypy], so the CLI and the
        # local `uv run mypy` check exactly the same set.
        run: uv run mypy
      - name: Check the mypy quarantine ratchet
        # `uv run mypy` above is green *because* of the quarantine, so on its
        # own it cannot see the suppressed errors change. This re-runs mypy with
        # the quarantine lifted and compares the per-module counts to
        # mypy-baseline.json — failing on a rise, on an un-locked-in fall, and
        # on an override that has stopped suppressing anything.
        run: uv run python scripts/check_mypy.py

  frontend:
    needs: changes
    # Always on main (coverage baked into the promoted image); on branches/PRs
    # only when frontend paths or the workflow itself changed.
    if: >-
      github.ref == 'refs/heads/main' ||
      needs.changes.outputs.frontend == 'true' ||
      needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # update the sticky coverage comment on PRs
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run type-check
      - name: Test with coverage
        run: npm run test:coverage
      - name: Coverage summary
        if: always()
        run: |
          mkdir -p coverage
          node scripts/coverage-summary.mjs | tee coverage/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Coverage PR comment
        if: success() && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: frontend-coverage
          path: frontend/coverage/summary.md
      - name: Upload coverage HTML
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage-html
          path: frontend/coverage/
      - name: Build
        run: npm run build
      - name: Check the build is free of GOV.UK residue
        run: npm run check:assets

  e2e:
    # Deliberately NOT gated on backend/frontend: e2e builds its own stack image
    # and shares no artifacts with them, so it runs fully in parallel to cut total
    # wall-clock. The deploy gate stays safe — `promote` still needs all of
    # backend/frontend/e2e/compose-smoke to pass (see its `needs` below).
    #
    # SCOPE: e2e is the pipeline's long pole, so it runs only where it earns its
    # cost — pull requests, main, and manual dispatch — not on every intermediate
    # feature-branch push. A PR re-runs it before merge, and main runs it as the
    # promote gate, so nothing reaches production un-e2e'd. Path-gated too:
    # skipped when only docs/config changed with no code (backend/frontend/ci
    # all false).
    needs: changes
    if: >-
      (github.event_name == 'pull_request' ||
       github.ref == 'refs/heads/main' ||
       github.event_name == 'workflow_dispatch') &&
      (github.ref == 'refs/heads/main' ||
       needs.changes.outputs.backend == 'true' ||
       needs.changes.outputs.frontend == 'true' ||
       needs.changes.outputs.ci == 'true')
    runs-on: ubuntu-latest
    # Without this, GitHub names each leg from every matrix value — "e2e
    # (desktop, chromium firefox webkit, chromium firefox webkit, 30)" — which
    # is unreadable in the checks list.
    name: e2e (${{ matrix.shard }})
    # SHARDED BY BROWSER PROJECT, one stack per shard. Playwright runs at
    # `workers: 1` because the specs share a backend and assert on library-wide
    # lists, so the five projects used to run end to end: 389s of a 407s step
    # (tablet-webkit 149s, mobile-webkit 144s, chromium 84s, firefox 6s,
    # webkit 6s). Splitting them across parallel jobs keeps that serial
    # execution exactly — a shard still runs its own specs one at a time — while
    # cutting the step to its longest single project.
    #
    # Each shard brings up its own stack, so every shard is now "the first
    # project" and uploads land as fresh content rather than duplicates. The
    # specs already accept both outcomes (`indexed.or(duplicate)` in
    # library.spec.ts and markdown-reader.spec.ts), and separate stacks are
    # strictly more isolated than one shared one, so nothing regresses.
    #
    # `browsers` is per-shard on purpose: mobile/tablet are WebKit descriptors,
    # so downloading and apt-installing Chromium and Firefox for them is pure
    # waste — and those two are the long shards, so it comes straight off the
    # critical path.
    #
    # `min-executed` is each shard's floor for scripts/assert-e2e-ran.mjs, set
    # below the observed count with headroom (desktop 53, mobile 44, tablet 40
    # on the run this was measured from). They sum to 77 against the old
    # single-job floor of 40, so sharding tightens the "did it actually run"
    # gate rather than loosening it.
    strategy:
      # One shard's failure must not cancel the others: a red mobile shard
      # should still tell you whether desktop and tablet are green.
      fail-fast: false
      matrix:
        include:
          - shard: desktop
            projects: chromium firefox webkit
            browsers: chromium firefox webkit
            min-executed: 30
          - shard: mobile
            projects: mobile-webkit
            browsers: webkit
            min-executed: 25
          - shard: tablet
            projects: tablet-webkit
            browsers: webkit
            min-executed: 22
    env:
      # Both compose files for every compose invocation (up/exec/logs/down).
      COMPOSE_FILE: docker-compose.yml:frontend/e2e/compose.e2e.yml
      E2E_BASE_URL: http://localhost:4173
      # The admin-gating spec needs a second, admin-role login alongside the
      # normal `e2e` user (created below).
      E2E_ADMIN_USERNAME: e2e-admin
      E2E_ADMIN_PASSWORD: e2e-admin-password-123
      # Read by frontend/playwright.config.ts, which throws on an unknown name
      # so a typo here fails loudly instead of running zero tests.
      E2E_PROJECTS: ${{ matrix.projects }}
      E2E_MIN_EXPECTED: ${{ matrix.min-executed }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Build the backend image via bake so it restores from the shared gha
      # layer cache when warm (the `build` job also writes it). Now that e2e is
      # un-gated it usually starts before `build`, so the cache is often cold and
      # this step rebuilds — `compose up` below then finds the loaded images and
      # skips its own build; on a cache/name miss it simply rebuilds — slower,
      # never broken.
      - name: Build the stack image (gha layer cache)
        uses: docker/bake-action@v7
        with:
          files: |
            docker-compose.yml
            frontend/e2e/compose.e2e.yml
          load: true
          set: |
            *.cache-from=type=gha,scope=library-image
      - name: Start the backend stack
        run: docker compose up -d db migrate api worker
      - name: Wait for the API
        run: timeout 180 bash -c 'until curl -fsS http://localhost:8000/healthz; do sleep 3; done'
      - name: Create the e2e user
        run: |
          echo 'e2e-password-123' | docker compose exec -T api \
            library user add e2e --display-name "E2E" --password-stdin
      - name: Create the e2e admin user
        run: |
          echo 'e2e-admin-password-123' | docker compose exec -T api \
            library user add e2e-admin --display-name "E2E Admin" --admin --password-stdin
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      # Keyed by shard as well as lockfile: the shards cache different browser
      # sets, and a shared key would hand a WebKit-only cache to the shard that
      # needs all three.
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.shard }}-${{ hashFiles('frontend/package-lock.json') }}
      # --with-deps is kept even though the cache above usually hits: the
      # browser binaries are cached, their apt dependencies are not, and every
      # run gets a fresh VM. Installing only this shard's browsers is what makes
      # it cheaper.
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps ${{ matrix.browsers }}
      - name: Build the frontend
        working-directory: frontend
        run: npm run build-only
      - name: Serve the build (vite preview proxies /api to :8000)
        working-directory: frontend
        run: |
          nohup npm run preview -- --port 4173 --strictPort > preview.log 2>&1 &
          timeout 60 bash -c 'until curl -fsS http://localhost:4173 > /dev/null; do sleep 1; done'
      # test:e2e:ci, not test:e2e: the CI variant chains
      # scripts/assert-e2e-ran.mjs, which fails when the suite reported success
      # without executing anything. `playwright test` exits 0 when every test
      # skips and offers no --fail-on-skip, so deleting E2E_BASE_URL above used
      # to make every spec skip and this job report green having launched
      # nothing. The floor is per-shard (E2E_MIN_EXPECTED, set from the matrix).
      # Local `npm run test:e2e` is deliberately left alone, so running it
      # without a stack still skips cleanly.
      - name: Run Playwright tests
        working-directory: frontend
        run: npm run test:e2e:ci
      - name: Upload the e2e JSON report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-json-report-${{ matrix.shard }}
          path: frontend/e2e-report.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.shard }}
          path: frontend/playwright-report/
          retention-days: 7
      - name: Backend logs on failure
        if: failure()
        run: docker compose logs api worker
      - name: Tear down the stack
        if: always()
        run: docker compose down -v

  # Deployment smoke test: the exact production compose file boots to a
  # healthy stack and a working login (W17 acceptance). Path-gated: skipped
  # when nothing that affects the built image changed.
  compose-smoke:
    needs: changes
    if: >-
      github.ref == 'refs/heads/main' ||
      needs.changes.outputs.backend == 'true' ||
      needs.changes.outputs.frontend == 'true' ||
      needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    env:
      # The runner talks plain HTTP to :8000; Secure cookies would be
      # dropped by curl's cookie jar. Production keeps the default (true).
      LIBRARY_COOKIE_SECURE: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build the stack image (gha layer cache)
        uses: docker/bake-action@v7
        with:
          files: docker-compose.yml
          load: true
          set: |
            *.cache-from=type=gha,scope=library-image
      - name: Start the full stack
        run: docker compose up -d
      - name: Wait for the API
        run: timeout 180 bash -c 'until curl -fsS http://localhost:8000/healthz; do sleep 3; done'
      - name: Wait for container healthchecks (api, worker, db)
        run: |
          timeout 120 bash -c '
            until [ "$(docker inspect -f "{{.State.Health.Status}}" \
              $(docker compose ps -q api) $(docker compose ps -q worker) $(docker compose ps -q db) \
              | sort -u)" = healthy ]; do sleep 3; done'
      - name: SPA shell is served at /
        run: curl -fsS http://localhost:8000/ | grep -q '<div id="app">'
      # The recorded recall baseline has to be IN the image, not merely in the
      # repository: `library eval-recall` reads it from RECALL_BASELINE_PATH
      # (/app here) and silently reports no delta when it is missing. It was
      # missing for exactly that reason once — committed, deployed, and absent
      # from the running container — so this asserts the COPY rather than
      # trusting it.
      - name: The recall baseline shipped in the image
        run: |
          docker compose exec -T api test -f /app/recall-baseline.json
          docker compose exec -T api python -c \
            "import json; d=json.load(open('/app/recall-baseline.json')); \
             assert d['cases'] and 'archive_documents' in d['measured_against'], d"
      # Same reasoning as the recall baseline above, for the photo OCR weights:
      # committing them to models/ocr/ ships nothing without the Dockerfile
      # COPY. Checked in the WORKER as well as the api, because the worker is
      # the process that actually runs OCR — the api would report a healthy
      # deploy while every photo ingest failed. --check verifies SHA256s, not
      # just presence, so a truncated layer is caught too.
      - name: The pinned OCR weights shipped in the image
        run: |
          docker compose exec -T api python -m scripts.fetch_ocr_models --check
          docker compose exec -T worker python -m scripts.fetch_ocr_models --check
      - name: /healthz reports the OCR weights present
        run: |
          curl -fsS http://localhost:8000/healthz \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["ocr_models"] == "ok", d'
      - name: Create a user
        run: |
          echo 'smoke-password-123' | docker compose exec -T api \
            library user add smoke --display-name "Smoke" --password-stdin
      - name: Log in (cookie) and list documents
        run: |
          curl -fsS -c cookies.txt -H 'Content-Type: application/json' \
            -d '{"username": "smoke", "password": "smoke-password-123"}' \
            http://localhost:8000/api/auth/login
          curl -fsS -b cookies.txt http://localhost:8000/api/documents | grep -q '"items"'
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v

  # Build the published image, gated on the backend + frontend test jobs so it
  # can bake in their real coverage numbers (the unified coverage-summary.json
  # the admin views read). Runs when at least one test job passed and neither
  # failed — so a path-skipped side (backend-only or frontend-only branch/PR)
  # still builds. On main both test jobs always run, so the promoted image bakes
  # complete coverage. Pushes the immutable :sha tag on main (the rollback
  # artifact and the source the promote step retags); on branches it skips the
  # push and only warms the cache. This job is the sole writer of the
  # `library-image` layer-cache scope that the e2e and compose-smoke bake builds
  # read from.
  build:
    needs: [changes, backend, frontend]
    if: >-
      !cancelled() &&
      needs.backend.result != 'failure' &&
      needs.frontend.result != 'failure' &&
      (needs.backend.result == 'success' || needs.frontend.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Pull the coverage reports the test jobs uploaded; missing artifacts are
      # tolerated so the build never fails for want of coverage (the script then
      # records a null pct for that side).
      - name: Download backend coverage JSON
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: backend-coverage-json
          path: coverage-artifacts/backend
      - name: Download frontend coverage report
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: frontend-coverage-html
          path: coverage-artifacts/frontend
      - name: Generate the unified coverage summary
        # Pure-stdlib script; the runner's system python3 is enough (no uv).
        run: |
          python3 scripts/coverage_summary.py \
            --backend-json coverage-artifacts/backend/coverage.json \
            --frontend-json coverage-artifacts/frontend/coverage-summary.json \
            --git-sha "$GIT_SHA" \
            --generated-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --output coverage-summary.json
          cat coverage-summary.json
        env:
          GIT_SHA: ${{ github.sha }}
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (push :sha on main; warm the cache on branches)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ghcr.io/johnmathews/library:${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=library-image
          cache-to: type=gha,scope=library-image,mode=max

  # Promote the tested build to :latest — a registry-side retag of the :sha
  # image (no rebuild, no pull, ~seconds), gated on the full green suite.
  # :latest is what production deploys, so it only moves once backend, frontend,
  # e2e and compose-smoke have all passed. On main every gated job runs, so the
  # standard all-success gating below holds.
  promote:
    needs: [build, backend, frontend, e2e, compose-smoke]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Retag :sha as :latest
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/johnmathews/library:latest \
            "ghcr.io/johnmathews/library:${GITHUB_SHA}"

  # The single aggregator status check, and the ONLY required one: the `main`
  # ruleset requires the `ci-gate` context and nothing else, with
  # `strict_required_status_checks_policy` on so a branch must be up to date
  # with main before it can merge. (That last part is not decoration — #143
  # merged green against a base without #142, and the auto-merged
  # `journal/README.md` failed `build_journal_index.py --check` on main.)
  #
  # Why the asymmetry the gate script enforces:
  #
  #   * Every job except `changes` may be `success` OR `skipped`. With per-area
  #     path skipping a job can legitimately not run, and a skipped *required*
  #     check blocks the merge forever (this is what stranded a Dependabot PR
  #     once). That skip-tolerance is deliberate and must stay.
  #
  #   * `changes` must be exactly `success`. It is unconditional (no `if:`), so
  #     the only results it can legitimately produce are success/failure/
  #     cancelled — `skipped` there means something is structurally wrong. It is
  #     also the job all five others declare `needs:` on, and GitHub reports a
  #     job whose dependency failed as `skipped`. So without this rule a broken
  #     `changes` (checkout flake, paths-filter outage, malformed `filters:`)
  #     would skip all five, leave the gate nothing to reject, and launder a
  #     wholly untested run into a green required check.
  #
  # The logic lives in scripts/ci_gate.sh so it is unit-tested
  # (tests/test_ci_gate.py) rather than only exercised in anger.
  ci-gate:
    needs: [changes, backend, frontend, e2e, compose-smoke, build, docs-stamps, typecheck]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Require that no upstream job failed
        # A job must appear in BOTH `needs:` above and the argument list below.
        # Listing it only in `needs:` makes the gate wait for it and then ignore
        # its result — silently, since ci_gate.sh can only judge what it is given.
        run: |
          scripts/ci_gate.sh \
            "changes=${{ needs.changes.result }}" \
            "backend=${{ needs.backend.result }}" \
            "frontend=${{ needs.frontend.result }}" \
            "e2e=${{ needs.e2e.result }}" \
            "compose-smoke=${{ needs.compose-smoke.result }}" \
            "build=${{ needs.build.result }}" \
            "docs-stamps=${{ needs.docs-stamps.result }}" \
            "typecheck=${{ needs.typecheck.result }}"
