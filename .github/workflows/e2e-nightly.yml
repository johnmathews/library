# Nightly heartbeat for the retrieval-recall measurement.
#
# Why this is not in the PR gate, and must not be moved there: `library
# eval-recall` needs a warm embedder to produce real vectors. The `e2e` job in
# ci.yml starts `db migrate api worker` only — no embedder at all — so recall
# cannot pass there by construction. TEI (the bge-m3 sidecar) also publishes no
# arm64 image, so it cannot be run on an Apple Silicon development machine
# either — only a host with a reachable embedder (Linux/amd64, or the deployed
# host) can drive it.
#
# So it runs here instead, nightly, with the embedder up and warm.
#
# NOT part of `ci-gate` and NOT a `promote` gate: a nightly failure is a signal
# to look, not a reason to block a merge. The honest cost of that choice is that
# a break here can sit for a day; the alternative is a flaky merge blocker, which
# gets disabled within a week and then protects nothing.
name: e2e-nightly

on:
  schedule:
    # 03:20 UTC. Off the hour because GitHub's scheduler queues heavily at :00.
    - cron: "20 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retrieval-recall:
    name: Retrieval recall
    runs-on: ubuntu-latest
    env:
      COMPOSE_FILE: docker-compose.yml:frontend/e2e/compose.e2e.yml
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build the stack image (gha layer cache)
        uses: docker/bake-action@v7
        with:
          files: |
            docker-compose.yml
            frontend/e2e/compose.e2e.yml
          load: true
          set: |
            *.cache-from=type=gha,scope=library-image
      # The whole stack, embedder included — the one difference from the PR gate.
      - name: Start the stack (with the embedder)
        run: docker compose up -d db migrate api worker embedder
      - name: Wait for the API
        run: timeout 180 bash -c 'until curl -fsS http://localhost:8000/healthz; do sleep 3; done'
      # The embedder downloads ~2GB of bge-m3 on a cold cache, so this waits far
      # longer than the API does. `/health` is TEI's own readiness endpoint: it
      # reports ready only once the model is loaded, which is the state the
      # recall measurement needs — a started container is not a warm embedder.
      #
      # Polled from inside the network, via the api container: the `embedder`
      # service publishes no ports (see docker-compose.yml), so it is reachable
      # only as `http://embedder:80` — the same address the app itself uses
      # (`LIBRARY_EMBEDDING_SERVICE_URL`). Curling localhost from the runner
      # would wait out the full timeout and then fail, having proved nothing.
      - name: Wait for the embedder to load its model
        run: |
          timeout 900 bash -c 'until docker compose exec -T api python -c "
          import urllib.request
          urllib.request.urlopen(\"http://embedder:80/health\", timeout=5)
          "; do sleep 5; done'
      # Retrieval recall (Plan B #15). Here rather than in the PR gate for the
      # reason at the top of this file: it needs the embedder. `library
      # eval-recall` runs as a CLI command inside the api container, seeding and
      # querying the database directly — it needs no authenticated user and
      # makes no HTTP call through the app, so it needs nothing this job used to
      # set up for the (now-deleted) browser journey.
      #
      # `continue-on-error: true` so this step only ever REPORTS — it can never
      # abort the job. It cannot gate today regardless: the corpus is
      # deliberately built so some cases fail at baseline (see
      # `library.ask.recall_scenarios`), and gating on it would reinstate an
      # abort this workflow has already had to be fixed for once. Gating on a
      # regression becomes possible once every case passes at baseline and stays
      # that way; re-tightening this step is a deliberate follow-up, not done
      # here.
      - name: Measure retrieval recall
        continue-on-error: true
        run: docker compose exec -T api library eval-recall
      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --tail 200
