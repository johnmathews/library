<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <!-- interactive-widget=resizes-content makes the on-screen keyboard shrink the
         layout/`dvh` viewport (Chromium/modern iOS), so a `100dvh` chat column and
         its bottom-docked composer sit directly above the keyboard rather than
         behind it. See docs/ask.md §1.6 and the Ask keyboard-viewport journal. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
    <meta name="description" content="Self-hosted personal document archive: scan, search and file the family paperwork.">
    <meta name="theme-color" content="#f3f4f6">
    <link rel="icon" href="/favicon.ico" sizes="48x48">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.webmanifest">
    <title>Library</title>
  </head>
  <body>
    <!-- Seed `body.sidebar-expanded` before Vue boots so the shell paints in
         its final state. This must mirror AppSidebar.vue's precedence exactly
         — the `library:`-prefixed key, then the legacy bare key, then the
         `matchMedia` viewport default — because any divergence *is* the flash
         this script exists to prevent. Guarded by
         `src/__tests__/sidebar-seed.spec.ts`. -->
    <script>
      (function () {
        var stored = localStorage.getItem('library:sidebar-expanded');
        if (stored === null) stored = localStorage.getItem('sidebar-expanded');
        var expanded =
          stored === null
            ? window.matchMedia('(min-width: 1024px)').matches
            : stored === 'true';
        document.querySelector('body').classList.toggle('sidebar-expanded', expanded);
      })();
    </script>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
